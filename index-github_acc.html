<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>GitHub Avatar Counter</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0d1117;
    color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  img {
    width: 200px;
    height: 200px;
    border-radius: 12px;
    border: 2px solid #30363d;
    margin-bottom: 16px;
    image-rendering: pixelated;
  }
  .id-label {
    font-size: 20px;
    margin-bottom: 8px;
  }
  .id-label b {
    color: #58a6ff;
  }
  button {
    margin-top: 20px;
    padding: 8px 16px;
    background: #21262d;
    color: #c9d1d9;
    border: 1px solid #30363d;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover {
    background: #30363d;
  }
</style>
</head>
<body>
  <div class="id-label">User ID: <b id="idText">...</b></div>
  <img id="avatarImg" src="" alt="avatar">
  <div>Обнови страницу (F5 / Ctrl+R), чтобы число увеличилось</div>
  <div style="margin-top:16px; display:flex; gap:12px;">
    <button id="prevBtn">-1 Назад</button>
    <button id="nextBtn">+1 Вперёд</button>
  </div>
  <button id="resetBtn">Сбросить в 14</button>

<script>
  const STORAGE_KEY = "githubAvatarCounter";
  const START_ID = 14;

  let current = localStorage.getItem(STORAGE_KEY);
  if (current === null) {
    current = START_ID;
  } else {
    current = parseInt(current, 10) + 1;
  }
  localStorage.setItem(STORAGE_KEY, current);

  document.getElementById("idText").textContent = current;
  document.getElementById("avatarImg").src =
    `https://avatars.githubusercontent.com/u/${current}?v=4&size=200`;

  document.getElementById("resetBtn").addEventListener("click", () => {
    localStorage.setItem(STORAGE_KEY, START_ID - 1);
    location.reload();
  });

  function updateDisplay(id) {
    document.getElementById("idText").textContent = id;
    document.getElementById("avatarImg").src =
      `https://avatars.githubusercontent.com/u/${id}?v=4&size=200`;
  }

  document.getElementById("nextBtn").addEventListener("click", () => {
    current = parseInt(localStorage.getItem(STORAGE_KEY), 10) + 1;
    localStorage.setItem(STORAGE_KEY, current);
    updateDisplay(current);
  });

  document.getElementById("prevBtn").addEventListener("click", () => {
    current = parseInt(localStorage.getItem(STORAGE_KEY), 10) - 1;
    localStorage.setItem(STORAGE_KEY, current);
    updateDisplay(current);
  });
</script>
</body>
</html>
